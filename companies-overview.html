<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6b00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OMSFIN">

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>OMSFIN — Все компании</title>
<meta name="description" content="Сводный дашборд по нескольким компаниям. Финансовые показатели всех организаций в одном экране — для бухгалтеров и агентств.">
<script src="/utils.js"></script>

<script>(function(){var t=localStorage.getItem("omsfin_token")||localStorage.getItem("omschicken_token");if(!t&&!localStorage.getItem("omsfin_demo"))window.location.replace("/login");})()</script>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/design-system.css">
<style>
  /* Плавный переход между темами */
  /* ── Светлая тема: фикс хардкоженных rgba(255,255,255,...) ── */
  body.light .stat-label{color:rgba(0,0,0,0.45)!important;}
  body.light .tx-date,body.light .tx-desc{color:rgba(0,0,0,0.45)!important;}
  body.light .hero-stat-sub{color:rgba(0,0,0,0.45)!important;}
  body.light .stat-card{box-shadow:0 1px 4px rgba(0,0,0,0.07),0 2px 10px rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.06);}
  body.light .stat-card:hover{box-shadow:0 4px 16px rgba(229,80,0,0.12)!important;}
  body.light header{box-shadow:0 1px 8px rgba(0,0,0,0.08);}
  body.light .hero-stat{background:linear-gradient(135deg,rgba(229,80,0,0.06),rgba(229,80,0,0.02))!important;border:1px solid rgba(229,80,0,0.12);}
  body.light .hero-stat::before{background:radial-gradient(circle at 0% 50%,rgba(229,80,0,0.08),transparent 60%)!important;}
  body.light .pill{color:rgba(0,0,0,0.55)!important;background:rgba(0,0,0,0.04)!important;}
  body.light .pill.active,.body.light .pill:hover{color:var(--accent)!important;background:rgba(229,80,0,0.08)!important;}
  body.light .progress-track,.body.light .chart-bar-wrap,.body.light .progress-wrap{background:rgba(0,0,0,0.07)!important;}
  body.light .section-title{color:var(--accent);}
  body.light .empty,.body.light .empty-state{color:rgba(0,0,0,0.35);}
  body.light .chart-card,.body.light .usn-calc-card,.body.light .forecast-card{box-shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);}
  body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);}
  body.light .ai-fab{box-shadow:0 4px 20px rgba(229,80,0,0.35);}
  body.light .bottom-nav{box-shadow:0 -1px 8px rgba(0,0,0,0.08);}
  body.light .tx-row:hover{background:rgba(0,0,0,0.02)!important;}
  body.light .modal,.body.light .ai-modal{box-shadow:0 20px 60px rgba(0,0,0,0.15)!important;}
  /* ── Аврора: градиентные акценты ── */
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:40px;}
  .logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:16px;}
  .logo span{color:var(--accent);}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}
  main{max-width:1080px;margin:0 auto;padding:24px 16px}
  .overview-hero{background:linear-gradient(135deg,rgba(255,107,0,0.08),rgba(255,107,0,0.02));border:1px solid rgba(255,107,0,0.2);border-radius:16px;padding:22px 24px;margin-bottom:16px}
  .overview-hero-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px}
  .overview-hero-value{font-family:'Unbounded',sans-serif;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .overview-hero-sub{font-size:13px;color:var(--text-2,#a3a3a3);margin-top:8px}
  .summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .summary-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
  .summary-value{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .summary-value.green{color:var(--green)}
  .summary-value.red{color:var(--red)}
  .summary-value.accent{color:var(--accent)}
  .period-label{font-size:12px;color:var(--muted);margin-bottom:16px}
  .company-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer;transition:all 0.2s}
  .company-card:hover{border-color:rgba(255,107,0,0.3)}
  .company-card.burning{border-color:rgba(239,68,68,0.35)}
  .company-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
  .company-name{font-size:15px;font-weight:600}
  .company-inn{font-size:11px;color:var(--muted);margin-top:2px}
  .company-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .role-badge{font-size:10px;padding:3px 10px;border-radius:20px;background:rgba(255,107,0,0.12);color:var(--accent);font-weight:600;text-transform:uppercase}
  .burn-badge{font-size:10px;padding:3px 10px;border-radius:20px;background:rgba(239,68,68,0.14);color:var(--red);font-weight:600;white-space:nowrap}
  .company-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat-mini{background:var(--surface2);border-radius:10px;padding:10px 12px}
  .stat-mini-label{font-size:10px;color:var(--muted);margin-bottom:4px}
  .stat-mini-value{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-icon{margin-bottom:12px;color:var(--muted);display:flex;justify-content:center}
  .empty-icon svg{width:36px;height:36px}
  .loading{text-align:center;padding:60px;color:var(--muted)}

  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:200;padding:6px 0 env(safe-area-inset-bottom,6px);}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:9px;padding:4px 0;transition:color 0.15s;}
  .bottom-nav a.active,.bottom-nav a:hover{color:var(--accent);}
  .bottom-nav .bn-icon{font-size:20px;line-height:1;}
  @media(max-width:700px){.bottom-nav{display:flex;} body{padding-bottom:60px;}}
</style>
</head>
<body>
<script>(function(){var s=JSON.parse(localStorage.getItem("omsfin_settings")||"{}");var t=s.autoTheme?(new Date().getHours()>=7&&new Date().getHours()<21?"light":"dark"):s.theme;if(t&&["light","blue"].includes(t))document.body.classList.add(t);if(s.accent)document.body.style.setProperty("--accent",s.accent);})()</script>
<header>
  <div class="logo">OMS<span>FIN</span></div>
  <a href="/" style="color:var(--muted);font-size:12px;text-decoration:none">← На главную</a>
</header>

<main>
  <div class="period-label" id="periodLabel"></div>

  <!-- Герой: суммарная прибыль по всем компаниям -->
  <div class="overview-hero" id="overviewHero" style="display:none">
    <div class="overview-hero-label">Общая прибыль за месяц</div>
    <div class="overview-hero-value" id="sumProfit">0 ₽</div>
    <div class="overview-hero-sub" id="overviewHeroSub"></div>
  </div>

  <div class="summary-row" id="summaryRow" style="display:none">
    <div class="summary-card">
      <div class="summary-label">Общий доход</div>
      <div class="summary-value green" id="sumIncome">0 ₽</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Общий расход</div>
      <div class="summary-value red" id="sumExpense">0 ₽</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">НДС к уплате (всего)</div>
      <div class="summary-value accent" id="sumVat">0 ₽</div>
    </div>
  </div>

  <div id="companiesList"><div class="loading">Загрузка…</div></div>
</main>

<script>
function fmt(n) { return Math.round(Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }

const ROLE_NAMES = { director: 'Директор', accountant: 'Бухгалтер', employee: 'Сотрудник' };

async function loadOverview() {
  const now = mskNow();
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  document.getElementById('periodLabel').textContent = `Сводка за ${months[now.getMonth()]} ${now.getFullYear()}`;

  try {
    const r = await fetch('/api/companies-overview', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    const data = await r.json();
    if (data.error) {
      document.getElementById('companiesList').innerHTML = `<div class="empty"><div class="empty-icon"><i data-lucide="triangle-alert"></i></div>${escapeHtml(data.error)}</div>`;
      if (window.lucide) lucide.createIcons();
      return;
    }

    const companies = data.companies || [];
    if (!companies.length) {
      document.getElementById('companiesList').innerHTML = `<div class="empty"><div class="empty-icon"><i data-lucide="building-2"></i></div>Нет доступных компаний</div>`;
      if (window.lucide) lucide.createIcons();
      return;
    }

    const totalIncome = companies.reduce((s, c) => s + c.income, 0);
    const totalExpense = companies.reduce((s, c) => s + c.expense, 0);
    const totalVat = companies.reduce((s, c) => s + c.vatToPay, 0);
    const totalProfit = companies.reduce((s, c) => s + c.profit, 0);
    const burning = companies.filter(c => c.profit < 0);

    document.getElementById('overviewHero').style.display = 'block';
    const heroVal = document.getElementById('sumProfit');
    heroVal.textContent = (totalProfit >= 0 ? '+' : '') + fmt(totalProfit);
    heroVal.style.color = totalProfit >= 0 ? 'var(--text)' : 'var(--red)';
    document.getElementById('overviewHeroSub').textContent = companies.length + ' ' +
      (companies.length === 1 ? 'компания' : companies.length < 5 ? 'компании' : 'компаний') +
      (burning.length ? ` · ${burning.length} в минусе` : '');

    document.getElementById('summaryRow').style.display = 'grid';
    document.getElementById('sumIncome').textContent = fmt(totalIncome);
    document.getElementById('sumExpense').textContent = fmt(totalExpense);
    document.getElementById('sumVat').textContent = fmt(totalVat);

    document.getElementById('companiesList').innerHTML = companies.map(c => `
      <div class="company-card${c.profit < 0 ? ' burning' : ''}" onclick="openCompany('${c.id}')">
        <div class="company-head">
          <div>
            <div class="company-name">${escapeHtml(c.name)}</div>
            <div class="company-inn">ИНН ${c.inn || '—'}</div>
          </div>
          <div class="company-badges">
            ${c.profit < 0 ? '<span class="burn-badge">В минусе</span>' : ''}
            <span class="role-badge">${ROLE_NAMES[c.role] || c.role}</span>
          </div>
        </div>
        <div class="company-stats">
          <div class="stat-mini"><div class="stat-mini-label">Доход</div><div class="stat-mini-value" style="color:var(--green)">${fmt(c.income)}</div></div>
          <div class="stat-mini"><div class="stat-mini-label">Расход</div><div class="stat-mini-value" style="color:var(--red)">${fmt(c.expense)}</div></div>
          <div class="stat-mini"><div class="stat-mini-label">Прибыль</div><div class="stat-mini-value" style="color:${c.profit < 0 ? 'var(--red)' : 'var(--text)'}">${fmt(c.profit)}</div></div>
          <div class="stat-mini"><div class="stat-mini-label">НДС к уплате</div><div class="stat-mini-value" style="color:var(--accent)">${fmt(c.vatToPay)}</div></div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
    document.getElementById('companiesList').innerHTML = `<div class="empty"><div class="empty-icon"><i data-lucide="circle-x"></i></div>Не получилось загрузить компании — попробуйте обновить страницу</div>`;
    if (window.lucide) lucide.createIcons();
  }
}

function openCompany(id) {
  localStorage.setItem('omsfin_company', id);
  window.location.href = '/';
}

loadOverview();
</script>

  <a href="/" class="active"><span class="bn-icon"><i data-lucide="home" style="width:20px;height:20px"></i></span>Главная</a>
