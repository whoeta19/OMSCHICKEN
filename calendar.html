<style>
:root{
  --bg:#080808;--surface:#0f0f0f;--surface2:#161616;--border:rgba(255,255,255,0.06);
  --text:#f5f5f5;--muted:rgba(255,255,255,0.35);--accent:#ff6b00;
  --green:#16a34a;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;
  --card-radius:14px;
}
body.light input,body.light select,body.light textarea{background:#fff!important;border-color:rgba(0,0,0,0.14)!important;color:#1a1a1a!important;}
body.light input::placeholder{color:rgba(0,0,0,0.35)!important;}
body.light .btn-outline{background:#fff!important;border-color:rgba(0,0,0,0.14)!important;color:#1a1a1a!important;}
body.light .section-title{color:var(--accent);}
body.light .bottom-nav a{color:rgba(0,0,0,0.45)!important;}
body.light .bottom-nav a.active{color:var(--accent)!important;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;font-size:14px;min-height:100vh;}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);}
.logo{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:900;letter-spacing:-0.5px;}
.logo span{color:var(--accent);}
.main{max-width:900px;margin:0 auto;padding:24px 16px 80px;}
h1{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:900;margin-bottom:4px;}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:24px;}

/* Фильтры */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:12px;cursor:pointer;transition:all 0.15s;font-family:Inter,sans-serif;}
.filter-btn:hover{color:var(--text);border-color:rgba(255,255,255,0.2);}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
body.light .filter-btn{background:#fff;}
body.light .filter-btn.active{background:var(--accent);color:#fff;}

/* Статистика */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:14px 16px;}
.stat-num{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:900;margin-bottom:2px;}
.stat-label{font-size:11px;color:var(--muted);}
.stat-card.urgent .stat-num{color:var(--red);}
.stat-card.soon .stat-num{color:var(--yellow);}
.stat-card.done .stat-num{color:var(--green);}

/* Блоки месяца */
.month-block{margin-bottom:28px;}
.month-title{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);}
.month-title span{color:var(--accent);margin-left:8px;font-size:11px;}

/* Карточка события */
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);
  padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:14px;
  transition:border-color 0.15s,opacity 0.2s;cursor:pointer;}
.event-card:hover{border-color:rgba(255,255,255,0.15);}
.event-card.done-card{opacity:0.45;}
.event-card.urgent-card{border-left:3px solid var(--red);}
.event-card.soon-card{border-left:3px solid var(--yellow);}

.event-check{width:20px;height:20px;min-width:20px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all 0.15s;flex-shrink:0;}
.event-card.done-card .event-check{background:var(--green);border-color:var(--green);color:#fff;font-size:11px;}

.event-body{flex:1;min-width:0;}
.event-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.event-date{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;color:var(--accent);}
.event-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;}
.tag-usn{background:rgba(59,130,246,0.15);color:#60a5fa;}
.tag-nds{background:rgba(239,68,68,0.15);color:#f87171;}
.tag-ndfl{background:rgba(234,179,8,0.15);color:#fbbf24;}
.tag-vznosy{background:rgba(22,163,74,0.15);color:#4ade80;}
.tag-profit{background:rgba(168,85,247,0.15);color:#c084fc;}
.tag-salary{background:rgba(249,115,22,0.15);color:#fb923c;}
.tag-stat{background:rgba(100,116,139,0.15);color:#94a3b8;}
.event-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.event-desc{font-size:12px;color:var(--muted);line-height:1.5;}
.event-badge-urgent{font-size:10px;color:var(--red);font-weight:600;}
.event-badge-soon{font-size:10px;color:var(--yellow);font-weight:600;}

.event-actions{display:flex;align-items:center;gap:8px;margin-top:8px;}
.btn-tg{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;font-family:Inter,sans-serif;transition:all 0.15s;}
.btn-tg:hover{color:var(--text);border-color:rgba(255,255,255,0.2);}

/* Пустой блок */
.empty-month{color:var(--muted);font-size:12px;padding:12px 0;}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:10px 18px;font-size:13px;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  header{padding:10px 14px;}
  .logo{font-size:14px;}
  .main{padding:12px 12px 80px;}
  .stats-row{grid-template-columns:repeat(3,1fr);gap:6px;}
  .stat-num{font-size:16px;}
  .stat-label{font-size:9px;}
  .event-card{padding:12px 10px;}
  .filter-bar{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap!important;padding-bottom:4px;}
  .filter-btn{flex-shrink:0;font-size:11px;padding:6px 10px;min-height:36px;}
  .event-title{font-size:13px;}
  .event-date{font-size:11px;}
  .month-title{font-size:14px;}
}

  {id:'dec4', date:'2026-12-28', tags:['profit'],  title:'Авансовый платёж по налогу на прибыль', desc:''},
  {id:'dec5', date:'2026-12-31', tags:['vznosy'],  title:'Фиксированные взносы ИП за 2026 год', desc:'Последний день уплаты фиксированных страховых взносов ИП за себя'},
];

const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const TAG_LABELS = {usn:'УСН',nds:'НДС',ndfl:'НДФЛ',vznosy:'Взносы',profit:'Прибыль',salary:'Зарплата',stat:'Статистика'};

let doneIds = JSON.parse(localStorage.getItem('omsfin_cal_done') || '[]');
let currentFilter = 'all';
// Дедлайны — по Москве (mskNow из utils.js), не по локальному поясу
const TODAY = mskNow(); TODAY.setHours(0,0,0,0);

function getStatus(dateStr) {
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const diff = Math.round((d - TODAY) / 86400000);
  if (diff < 0) return 'past';
  if (diff <= 14) return 'urgent';
  if (diff <= 45) return 'soon';
  return 'future';
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleDone(id, e) {
  setTimeout(renderNext3, 0);
  e.stopPropagation();
  if (doneIds.includes(id)) {
    doneIds = doneIds.filter(x => x !== id);
  } else {
    doneIds.push(id);
    showToast('✅ Отмечено как выполнено');
  }
  localStorage.setItem('omsfin_cal_done', JSON.stringify(doneIds));
  render();
}

async function remindTg(event, e) {
  e.stopPropagation();
  const token = localStorage.getItem('omsfin_token') || localStorage.getItem('omschicken_token') || '';
  if (!token) { showToast('⚠️ Нужна авторизация'); return; }
  const d = new Date(event.date);
  const dateStr = d.toLocaleDateString('ru-RU', {day:'numeric',month:'long'});
  const text = `📅 Напоминание\n${dateStr}: ${event.title}`;
  try {
    const r = await fetch('/api/notify', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({message: text})
    });
    if (r.ok) showToast('📱 Напоминание отправлено в Telegram');
    else showToast('⚠️ Telegram не подключён — настрой в параметрах');
  } catch(err) {
    showToast('⚠️ Telegram не подключён');
  }
}

function renderNext3() {
  const upcoming = EVENTS
    .map(e => ({...e, d: new Date(e.date)}))
    .filter(e => e.d >= TODAY && !doneIds.includes(e.id))
    .sort((a,b) => a.d - b.d)
    .slice(0, 3);
  const wrap = document.getElementById('next3');
  const cards = document.getElementById('next3Cards');
  if (!upcoming.length || !wrap) return;
  const MONTHS_R = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  cards.innerHTML = upcoming.map((e, i) => {
    const diff = Math.round((e.d - TODAY) / 86400000);
    const word = diff % 10 === 1 && diff % 100 !== 11 ? 'день' : [2,3,4].includes(diff % 10) && ![12,13,14].includes(diff % 100) ? 'дня' : 'дней';
    const urgent = diff <= 14;
    return `<div style="background:${i===0 ? 'linear-gradient(135deg,rgba(255,107,0,0.08),rgba(255,107,0,0.02))' : 'var(--surface)'};border:1px solid ${urgent ? 'rgba(239,68,68,0.35)' : i===0 ? 'rgba(255,107,0,0.2)' : 'var(--border)'};border-radius:14px;padding:16px 18px">
      <div style="font-family:'Unbounded',sans-serif;font-size:${i===0 ? '26px' : '20px'};font-weight:900;font-variant-numeric:tabular-nums;color:${urgent ? 'var(--red)' : 'var(--text)'};line-height:1.1">${diff === 0 ? 'сегодня' : diff + ' ' + word}</div>
      <div style="font-size:12px;font-weight:600;margin-top:8px;line-height:1.4">${e.title}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:3px">${e.d.getDate()} ${MONTHS_R[e.d.getMonth()]}</div>
    </div>`;
  }).join('');
  wrap.style.display = 'block';
}

function render() {
  let events = EVENTS;

  if (currentFilter === 'upcoming') {
    events = events.filter(e => {
      const s = getStatus(e.date);
      return (s === 'urgent' || s === 'soon') && !doneIds.includes(e.id);
    });
  } else if (currentFilter !== 'all') {
    events = events.filter(e => e.tags.includes(currentFilter));
  }

  // Статистика
  const allFuture = EVENTS.filter(e => getStatus(e.date) !== 'past');
  const urgent = allFuture.filter(e => getStatus(e.date) === 'urgent' && !doneIds.includes(e.id));
  const soon = allFuture.filter(e => getStatus(e.date) === 'soon' && !doneIds.includes(e.id));
  document.getElementById('statUrgent').textContent = urgent.length;
  document.getElementById('statSoon').textContent = soon.length;
  document.getElementById('statDone').textContent = doneIds.length;

  // Группировка по месяцам
  const byMonth = {};
  events.forEach(e => {
    const key = e.date.substring(0,7); // YYYY-MM
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(e);
  });

  const root = document.getElementById('calendarRoot');
  if (!Object.keys(byMonth).length) {
    root.innerHTML = '<div style="color:var(--muted);text-align:center;padding:40px 0;font-size:14px;">Нет событий по выбранному фильтру</div>';
    return;
  }

  root.innerHTML = Object.keys(byMonth).sort().map(key => {
    const [yr, mo] = key.split('-');
    const monthName = MONTH_NAMES[parseInt(mo)-1] + ' ' + yr;
    const monthEvents = byMonth[key];
    const urgentCount = monthEvents.filter(e => getStatus(e.date) === 'urgent' && !doneIds.includes(e.id)).length;

    const eventsHtml = monthEvents.map(e => {
      const done = doneIds.includes(e.id);
      const status = getStatus(e.date);
      const d = new Date(e.date);
      const dateLabel = d.toLocaleDateString('ru-RU', {day:'numeric',month:'long'});
      const urgentBadge = !done && status === 'urgent' ? '<span class="event-badge-urgent">🔥 Срочно</span>' : '';
      const soonBadge = !done && status === 'soon' ? '<span class="event-badge-soon">⏰ Скоро</span>' : '';
      const cardClass = done ? 'event-card done-card' : status === 'urgent' ? 'event-card urgent-card' : status === 'soon' ? 'event-card soon-card' : 'event-card';
      const checkInner = done ? '✓' : '';
      const tagsHtml = e.tags.map(t => `<span class="event-tag tag-${t}">${TAG_LABELS[t]||t}</span>`).join('');
      return `
        <div class="${cardClass}" onclick="toggleDone('${e.id}',event)">
          <div class="event-check">${checkInner}</div>
          <div class="event-body">
            <div class="event-header">
              <span class="event-date">${dateLabel}</span>
              ${tagsHtml}
              ${urgentBadge}${soonBadge}
            </div>
            <div class="event-title">${e.title}</div>
            ${e.desc ? `<div class="event-desc">${e.desc}</div>` : ''}
            <div class="event-actions">
              <button class="btn-tg" onclick="remindTg(${JSON.stringify(e).replace(/"/g,'&quot;')},event)">📱 Напомнить в Telegram</button>
            </div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="month-block">
        <div class="month-title">${monthName}${urgentCount ? `<span>🔥 ${urgentCount} срочных</span>` : ''}</div>
        ${eventsHtml}
      </div>`;
  }).join('');
}

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Автоскролл к ближайшему событию при загрузке
window.addEventListener('DOMContentLoaded', () => {
  render();
  renderNext3();
  // Небольшой скролл к текущему месяцу
  setTimeout(() => {
    const now = mskNow();
    const key = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    const blocks = document.querySelectorAll('.month-block');
    blocks.forEach(b => {
      if (b.querySelector('.month-title') && b.querySelector('.month-title').textContent.includes(MONTH_NAMES[now.getMonth()])) {
        b.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
  }, 200);
});
</script>
</body>
</html>
