<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОМСЧИКЕН — Бухгалтерия</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#ff6b00;--accent2:#ffaa44;--green:#22c55e;--red:#ef4444;--text:#f0f0f0;--muted:#666;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;}
  .logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:17px;}
  .logo span{color:var(--accent);}
  .header-right{display:flex;align-items:center;gap:10px;}
  .sync-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;padding:5px 10px;cursor:pointer;transition:all 0.2s;}
  .sync-btn:hover{border-color:var(--accent);color:var(--accent);}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;}
  .sync-dot.offline{background:var(--red);}
  .header-meta{font-size:11px;color:var(--muted);}
  .tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--border);background:var(--surface);}
  .tab{padding:9px 14px;border:none;background:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  main{padding:18px 20px;max-width:860px;margin:0 auto;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .stat-value{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;}
  .stat-value.green{color:var(--green);}.stat-value.red{color:var(--red);}.stat-value.orange{color:var(--accent);}
  .btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 18px;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .btn:hover{background:var(--accent2);}
  .btn-sm{padding:6px 12px;font-size:10px;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s;}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent);}
  .section-title{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .tx-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:5px;}
  .tx-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-date{font-size:10px;color:var(--muted);margin-top:2px;}
  .tx-amount{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;text-align:right;white-space:nowrap;}
  .tx-amount.plus{color:var(--green);}.tx-amount.minus{color:var(--red);}
  .cat-badge{font-size:10px;padding:3px 7px;border-radius:20px;font-weight:500;white-space:nowrap;}
  .cat-chicken{background:#1a3a1a;color:#4ade80;}.cat-income{background:#0a2a1a;color:#22c55e;}
  .cat-personal{background:#3a1a0a;color:#fb923c;}.cat-transport{background:#1a1a3a;color:#818cf8;}
  .cat-food{background:#2a1a0a;color:#fbbf24;}.cat-unknown{background:#2a2a2a;color:#888;}
  .cat-salary{background:#1a2a3a;color:#38bdf8;}.cat-office{background:#2a2a1a;color:#a3e635;}
  .upload-zone{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:16px;background:var(--surface);}
  .upload-zone:hover{border-color:var(--accent);}
  .upload-title{font-size:14px;font-weight:500;margin:6px 0 3px;}
  .upload-sub{font-size:11px;color:var(--muted);}
  .progress-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;display:none;}
  .progress-wrap.active{display:block;}
  .progress-track{background:var(--border);border-radius:4px;height:4px;margin-top:8px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width 0.4s;width:0%;}
  .filter-bar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
  .filter-btn{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all 0.2s;}
  .filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
  .empty{text-align:center;padding:36px 0;color:var(--muted);}
  .empty-icon{font-size:32px;margin-bottom:8px;}
  .page{display:none;}.page.active{display:block;}
  .input-group{margin-bottom:10px;}
  .input-group label{font-size:11px;color:var(--muted);margin-bottom:3px;display:block;}
  .input-group input,.input-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;}
  .input-group input:focus,.input-group select:focus{border-color:var(--accent);}
  .input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toast{position:fixed;bottom:20px;right:16px;left:16px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:13px;transform:translateY(100px);opacity:0;transition:all 0.3s;z-index:999;}
  .toast.show{transform:translateY(0);opacity:1;}
  .info-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;font-size:13px;line-height:1.6;}
  .info-box.success{border-color:var(--green);}
  .chart-row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .chart-item{display:flex;align-items:center;gap:8px;font-size:12px;}
  .chart-bar-wrap{flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden;}
  .chart-bar{height:100%;border-radius:4px;transition:width 0.5s;}
  .chart-label{width:80px;color:var(--muted);font-size:11px;}
  .chart-val{width:75px;text-align:right;font-family:'Unbounded',sans-serif;font-size:10px;}
  ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<header>
  <div class="logo">ОМС<span>ЧИКЕН</span></div>
  <header>
  <div class="logo">OMS<span>FIN</span></div>
  <div style="display:flex;align-items:center;gap:8px">
    <select id="companySwitcher" onchange="switchCompany(this.value)" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:11px;padding:5px 8px;cursor:pointer;max-width:130px;outline:none;">
      <option value="">Компания...</option>
    </select>
    <div style="position:relative">
      <button id="profileBtn" onclick="toggleProfile()" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ffaa44);border:none;cursor:pointer;font-size:12px;font-weight:700;color:#000;display:flex;align-items:center;justify-content:center;">М</button>
      <div id="profileMenu" style="display:none;position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:180px;z-index:200;box-shadow:0 20px 40px rgba(0,0,0,0.4);">
        <div id="profileEmail" style="padding:8px 10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:4px"></div>
        <button onclick="window.location.href='/settings';document.getElementById('profileMenu').style.display='none'" style="width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:12px;padding:8px 10px;cursor:pointer;border-radius:8px" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='none'">⚙️ Настройки</button>
        <div style="height:1px;background:var(--border);margin:4px 0"></div>
        <button onclick="logout()" style="width:100%;text-align:left;background:none;border:none;color:#ef4444;font-size:12px;padding:8px 10px;cursor:pointer;border-radius:8px" onmouseover="this.style.background='rgba(239,68,68,0.08)'" onmouseout="this.style.background='none'">← Выйти</button>
      </div>

  </div>
</header>
    <button class="sync-btn" onclick="syncNow()" id="syncBtn"><span class="sync-dot" id="syncDot"></span>Синхронизация</button>

  </div>
</header>
<div class="tabs">

  <button class="tab" onclick="showPage('transactions',this)">📋 Операции</button>
  <button class="tab" onclick="showPage('add',this)">➕ Добавить</button>

  <button class="tab" onclick="window.location.href='/tools'">⚡ Инструменты</button>
</div>
<main>

<div class="page active" id="page-dashboard">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Доход</div><div class="stat-value green" id="statIncome">0 ₽</div></div>
    <div class="stat-card"><div class="stat-label">Расход</div><div class="stat-value red" id="statExpense">0 ₽</div></div>
    <div class="stat-card"><div class="stat-label">Личные</div><div class="stat-value orange" id="statPersonal">0 ₽</div></div>

  <div style="display:flex;gap:8px;margin-bottom:8px"><button onclick="clearAllData()" style="background:none;border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:6px 12px;color:#ef4444;font-size:11px;cursor:pointer">🗑️ Очистить</button></div>

  </div>

<div class="toast" id="toast"></div>

<script>
let allTx = [];
let currentFilter = 'all';
let synced = false;

// ---- КЛАССИФИКАЦИЯ ----
function classify(name, description, amount) {
  if (amount > 0) return 'income';
  const text = (name + ' ' + description).toLowerCase();
  if (/яндекс.?еда|yandex.*eda|eda\.|лавка|lavka|вкусвилл|vkusvill|al capone|ресторан|кафе|столовая|burger|pizza|суши|sushi|макдоналдс|kfc|subway|domino/.test(text)) return 'food';
  if (/яндекс.?такси|yandex.*taxi|yandex.*go|fasten|такси|uber|ситимобил|азс|лукойл|газпромнефть|роснефть|shell|топливо|бензин|neftmagist|нефть/.test(text)) return 'transport';
  if (/wildberries|wb\*|озон|ozon|авито|lamoda|спортмастер|dns|м\.видео|мвидео|икеа|ikea|zara|h&m|adidas|nike|goods|ситилинк/.test(text)) return 'personal';
  if (/агросфера|агро|птица|курятина|куры|мясо|птицефабрик|птицекомбинат|мясокомбинат|мясоперерабатыв|chicken|бройлер|индейк/.test(text)) return 'chicken';
  if (/зарплата|зп\b|аванс|выплата сотрудник/.test(text)) return 'salary';
  if (/аренда|коворкинг|офис|склад/.test(text)) return 'office';
  if (/овердрафт|кредит|погашение|банк|комиссия за вывод|плата за|обслуживание счет|лимит/.test(text)) return 'bank';
  return 'unknown';
}

// ---- API ----
async function apiGet() {
  const r = await fetch('/api/transactions');
  if (!r.ok) throw new Error('Ошибка сервера');
  return r.json();
}

async function apiPost(txs) {
  const r = await fetch('/api/transactions', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(txs)
  });
  if (!r.ok) throw new Error('Ошибка сохранения');
  return r.json();
}

async function apiClear() {
  await fetch('/api/clear', { method: 'DELETE' });
}

// ---- SYNC ----
async function syncNow() {
  document.getElementById('syncBtn').textContent = '⏳ Синхронизация...';
  try {
    allTx = await apiGet();
    synced = true;
    document.getElementById('syncDot').className = 'sync-dot';
    document.getElementById('syncBtn').innerHTML = '<span class="sync-dot"></span>Синхронизировано';
    renderAll();
    showToast('✅ Данные синхронизированы');
  } catch(e) {
    synced = false;
    document.getElementById('syncDot').className = 'sync-dot offline';
    document.getElementById('syncBtn').innerHTML = '<span class="sync-dot offline"></span>Нет связи';
    showToast('❌ Нет связи с сервером');
  }
}

// ---- FILE ----
async function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const text = await file.text();
  parseAndProcess(text);
  e.target.value = '';
}

async function parseAndProcess(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const txs = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(';').map(c => c.replace(/^"|"$/g,'').replace(/""/g,'"').trim());
    if (cols.length < 8) continue;
    const type = cols[1] || '';
    const date = cols[2] || '';
    const amountRaw = cols[5] || '0';
    const amount = parseFloat(amountRaw.replace(',','.')) * (type==='Дебет'?-1:1);
    if (isNaN(amount)||amount===0) continue;
    const description = cols[7] || '';
    const counterparty = (cols[24]||'').replace(/^АО "ТБанк"$|^ТБанк$/gi,'').trim();
    const name = counterparty.length>2 ? counterparty : description;
    const category = classify(name, description, amount);
    txs.push({name, amount, date, description, category, is_personal:['personal','food'].includes(category)});
  }
  if (txs.length===0){showToast('❌ Не удалось прочитать файл');return;}

  const wrap=document.getElementById('progressWrap');
  const fill=document.getElementById('progressFill');
  const ptxt=document.getElementById('progressText');
  wrap.classList.add('active');
  fill.style.width='30%';
  ptxt.textContent=`Классифицировано ${txs.length} операций. Сохраняю...`;

  try {
    await fetch('/api/transactions', { method: 'DELETE' });
      await apiPost(txs);
    fill.style.width='100%';
    ptxt.textContent=`✅ Загружено и сохранено ${txs.length} операций!`;
    setTimeout(()=>{wrap.classList.remove('active');fill.style.width='0%';},1500);
    await syncNow();
  } catch(e) {
    // Fallback to local
    allTx=[...txs,...allTx];
    fill.style.width='100%';
    ptxt.textContent=`✅ Загружено ${txs.length} (локально)`;
    setTimeout(()=>{wrap.classList.remove('active');fill.style.width='0%';},1500);
    renderAll();
    showToast(`⚠️ Сохранено локально (нет связи)`);
  }
}

function addManual() {
  const name=document.getElementById('addName').value.trim();
  const amount=parseFloat(document.getElementById('addAmount').value);
  const date=document.getElementById('addDate').value||new Date().toISOString().split('T')[0];
  const desc=document.getElementById('addDesc').value.trim();
  const manualCat=document.getElementById('addCat').value;
  if(!name||isNaN(amount)){showToast('Заполни название и сумму');return;}
  const cat=manualCat||classify(name,desc,amount);
  const tx={name,amount,date,description:desc,category:cat,is_personal:['personal','food'].includes(cat)};
  apiPost([tx]).then(()=>syncNow()).catch(()=>{
    allTx=[tx,...allTx];renderAll();
  });
  document.getElementById('addResult').innerHTML=`<div class="info-box success">✅ Сохранено: <strong>${name}</strong> — ${getCatBadge(cat)}</div>`;
  document.getElementById('addName').value='';
  document.getElementById('addAmount').value='';
  document.getElementById('addDesc').value='';
  document.getElementById('addCat').value='';
}

async function clearAll() {
  if(!confirm('Удалить все данные с сервера?'))return;
  await apiClear();
  allTx=[];renderAll();showToast('Данные очищены');
}

// ---- RENDER ----
function renderAll() {
  const income=allTx.filter(t=>t.amount>0).reduce((s,t)=>s+Number(t.amount),0);
  const expense=allTx.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const personal=allTx.filter(t=>t.is_personal).reduce((s,t)=>s+Math.abs(t.amount),0);
  document.getElementById('statIncome').textContent=fmt(income);
  document.getElementById('statExpense').textContent=fmt(expense);
  document.getElementById('statPersonal').textContent=fmt(personal);
  document.getElementById('headerMeta').textContent=allTx.length+' операций';
  renderChart();
  const recent=allTx.slice(0,6);
  document.getElementById('recentList').innerHTML=recent.length?recent.map(txHTML).join(''):'<div class="empty"><div class="empty-icon">🐔</div><div>Загрузи выписку или добавь операцию</div></div>';
  renderTxList();
}

function renderChart() {
  const cats=[
    {key:'chicken',label:'🐔 Курятина',color:'#4ade80'},
    {key:'transport',label:'🚗 Транспорт',color:'#818cf8'},
    {key:'food',label:'🍽️ Еда',color:'#fbbf24'},
    {key:'personal',label:'🛍️ Личное',color:'#fb923c'},
    {key:'salary',label:'👥 Зарплата',color:'#38bdf8'},
    {key:'office',label:'🏢 Офис',color:'#a3e635'},
    {key:'unknown',label:'❓ Прочее',color:'#555'},
  ];
  const totals=cats.map(c=>({...c,val:allTx.filter(t=>t.category===c.key&&t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0)}));
  const max=Math.max(...totals.map(t=>t.val),1);
  const active=totals.filter(t=>t.val>0);
  if(!active.length){document.getElementById('chartArea').innerHTML='<div style="color:var(--muted);font-size:12px;margin-bottom:16px">Загрузи выписку чтобы увидеть аналитику</div>';return;}
  document.getElementById('chartArea').innerHTML=`<div class="chart-row">${active.map(c=>`
    <div class="chart-item">
      <div class="chart-label">${c.label}</div>
      <div class="chart-bar-wrap"><div class="chart-bar" style="width:${(c.val/max*100).toFixed(0)}%;background:${c.color}"></div></div>
      <div class="chart-val" style="color:${c.color}">${fmt(c.val)}</div>
    </div>`).join('')}</div>`;
}

function renderTxList() {
  const filtered=currentFilter==='all'?allTx:currentFilter==='income'?allTx.filter(t=>t.amount>0):allTx.filter(t=>t.category===currentFilter);
  document.getElementById('txCount').textContent=filtered.length+' операций';
  document.getElementById('txList').innerHTML=filtered.length?filtered.map(txHTML).join(''):'<div class="empty"><div class="empty-icon">🔍</div><div>Нет операций</div></div>';
}

function txHTML(tx) {
  const plus=tx.amount>0;
  return `<div class="tx-row">
    <div style="min-width:0"><div class="tx-name">${tx.name}</div><div class="tx-date">${tx.date||''}</div></div>
    <div>${getCatBadge(tx.category)}</div>
    <div class="tx-amount ${plus?'plus':'minus'}">${plus?'+':''}${fmt(tx.amount)}</div>
  </div>`;
}

function getCatBadge(cat) {
  const m={income:['cat-income','💰 Доход'],chicken:['cat-chicken','🐔 Курятина'],transport:['cat-transport','🚗 Транспорт'],food:['cat-food','🍽️ Еда'],personal:['cat-personal','🛍️ Личное'],salary:['cat-salary','👥 Зарплата'],office:['cat-office','🏢 Офис'],unknown:['cat-unknown','❓ Прочее']};
  const[cls,lbl]=m[cat]||m.unknown;
  return `<span class="cat-badge ${cls}">${lbl}</span>`;
}

function filterTx(cat,btn) {
  currentFilter=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTxList();
}

function clearAllData() {
  if (!confirm("Удалить все операции?")) return;
  fetch("/api/transactions", {method:"DELETE", body: JSON.stringify({}), headers:{"Content-Type":"application/json"}}).then(()=>{ allTx=[]; renderAll(); showToast("✅ Данные очищены"); });
}

function exportCSV() {
  const rows=[['Дата','Контрагент','Сумма','Категория','Назначение']];
  allTx.forEach(t=>rows.push([t.date,t.name,t.amount,t.category,t.description||'']));
  const csv='\ufeff'+rows.map(r=>r.join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='omschicken_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
  showToast('📥 Файл скачан');
}

function fmt(n){return Math.abs(n).toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽';}
function showPage(name,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');if(btn)btn.classList.add('active');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}

document.getElementById('addDate').value=new Date().toISOString().split('T')[0];
syncNow();
</script>
</body>
