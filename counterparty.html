<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSFIN — Анализ контрагентов</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080808;--surface:#0f0f0f;--surface2:#161616;--border:rgba(255,255,255,0.07);--accent:#ff6b00;--accent2:#ffaa44;--green:#22c55e;--red:#ef4444;--text:#f5f5f5;--muted:#666;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(8,8,8,0.9);backdrop-filter:blur(24px);position:sticky;top:0;z-index:100;}
  .logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:16px;}
  .logo span{color:var(--accent);}
  main{padding:20px 24px;max-width:900px;margin:0 auto;}
  .search-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;}
  .search-row{display:flex;gap:10px;}
  .search-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:all 0.2s;}
  .search-input:focus{border-color:rgba(255,107,0,0.5);box-shadow:0 0 0 3px rgba(255,107,0,0.08);}
  .btn{background:linear-gradient(135deg,var(--accent),#e55a00);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 15px rgba(255,107,0,0.25);white-space:nowrap;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(255,107,0,0.4);}
  .btn-outline{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 16px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s;}
  .btn-outline:hover{border-color:rgba(255,107,0,0.4);color:var(--accent);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .status-active{background:rgba(34,197,94,0.1);color:var(--green);border:1px solid rgba(34,197,94,0.2);}
  .status-dead{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
  .status-warning{background:rgba(255,107,0,0.1);color:var(--accent);border:1px solid rgba(255,107,0,0.2);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .info-item{background:var(--surface2);border-radius:10px;padding:12px;}
  .info-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .info-value{font-size:13px;font-weight:500;line-height:1.4;}
  .risk-score{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;margin-bottom:14px;}
  .risk-low{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);}
  .risk-med{background:rgba(255,107,0,0.08);border:1px solid rgba(255,107,0,0.2);}
  .risk-high{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);}
  .risk-circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:16px;font-weight:900;flex-shrink:0;}
  .risk-circle.low{background:rgba(34,197,94,0.2);color:var(--green);}
  .risk-circle.med{background:rgba(255,107,0,0.2);color:var(--accent);}
  .risk-circle.high{background:rgba(239,68,68,0.2);color:var(--red);}
  .check-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;}
  .check-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
  .check-label{font-size:13px;font-weight:500;}
  .check-desc{font-size:11px;color:var(--muted);margin-top:2px;}
  .history-item{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all 0.2s;}
  .history-item:hover{border-color:rgba(255,107,0,0.2);}
  .tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--border);background:#0d0d0d;overflow-x:auto;scrollbar-width:none;}
  .tab{padding:10px 14px;border:none;background:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:11.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;white-space:nowrap;font-weight:400;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .tab:hover:not(.active){color:rgba(255,255,255,0.7);}
  .page{display:none;}.page.active{display:block;}
  .loading{text-align:center;padding:30px;color:var(--muted);}
  .spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:8px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .from-tx-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
  .from-tx-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border-radius:8px;cursor:pointer;transition:all 0.2s;}
  .from-tx-item:hover{background:rgba(255,107,0,0.06);}
  @media(max-width:600px){.info-grid{grid-template-columns:1fr;}.search-row{flex-direction:column;}}
</style>
<script src="/nav.js"></script>
</head>
<body>
<header>
  <div class="logo">OMS<span>FIN</span></div>
  <button class="btn-outline" onclick="window.location.href='/'">← Назад</button>
</header>
<div class="tabs">
  <button class="tab active" onclick="showPage('search',this)">🔍 Проверить</button>
  <button class="tab" onclick="showPage('fromtx',this)">📋 Из выписки</button>
  <button class="tab" onclick="showPage('history',this)">🕐 История</button>
</div>
<main>

<!-- ПОИСК -->
<div class="page active" id="page-search">
  <div style="margin-bottom:20px;margin-top:4px">
    <div style="font-family:Unbounded,sans-serif;font-size:20px;font-weight:900;margin-bottom:6px">🔍 Анализ контрагента</div>
    <div style="font-size:13px;color:var(--muted)">Проверь партнёра перед сделкой — статус, руководитель, риски</div>
  </div>
  <div class="search-box">
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Введи ИНН или название компании</div>
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="ИНН: 5800015301 или название" maxlength="100"
        onkeydown="if(event.key==='Enter')checkCompany()">
      <button class="btn" onclick="checkCompany()">Проверить →</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--muted)">Попробуй:</span>
      <span onclick="document.getElementById('searchInput').value='7707083893';checkCompany()" style="font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline">Сбербанк</span>
      <span onclick="document.getElementById('searchInput').value='7736207543';checkCompany()" style="font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline">Газпром</span>
      <span onclick="document.getElementById('searchInput').value='5800015301';checkCompany()" style="font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline">ОМСЧИКЕН</span>
    </div>
  </div>
  <div id="searchResult"></div>
</div>

<!-- ИЗ ВЫПИСКИ -->
<div class="page" id="page-fromtx">
  <div style="margin-bottom:16px;margin-top:4px">
    <div style="font-family:Unbounded,sans-serif;font-size:18px;font-weight:900;margin-bottom:6px">📋 Контрагенты из выписки</div>
    <div style="font-size:13px;color:var(--muted)">Все компании с которыми работаешь</div>
  </div>
  <div id="fromTxList"><div class="loading">⏳ Загружаем операции...</div></div>
</div>

<!-- ИСТОРИЯ -->
<div class="page" id="page-history">
  <div style="margin-bottom:16px;margin-top:4px">
    <div style="font-family:Unbounded,sans-serif;font-size:18px;font-weight:900;margin-bottom:6px">🕐 История проверок</div>
  </div>
  <div id="historyList"></div>
</div>

</main>
<script>
let checkHistory = JSON.parse(localStorage.getItem('omsfin_cp_history') || '[]');

// Преобразует дату формата DD.MM.YYYY в timestamp для корректного хронологического сравнения
// (обычное сравнение строк '20.12.2025' > '05.01.2026' даёт неверный результат).
function parseDMY(str) {
  if (!str) return 0;
  const [dd, mm, yyyy] = str.split('.').map(Number);
  if (!dd || !mm || !yyyy) return 0;
  return new Date(yyyy, mm - 1, dd).getTime();
}

async function checkCompany() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  
  const result = document.getElementById('searchResult');
  result.innerHTML = `<div class="loading"><div class="spinner"></div><div>Запрашиваем данные ФНС...</div></div>`;
  
  try {
    // Используем открытый API ФНС через dadata или egrul
    const isINN = /^\d{10,12}$/.test(query);
    
    let data = null;
    
    // Пробуем API ФНС ЕГРЮЛ
    if (isINN) {
      data = await fetchFromEGRUL(query);
    }
    
    if (!data) {
      // Если не нашли — показываем форму ручного ввода
      result.innerHTML = generateManualForm(query);
      return;
    }
    
    renderResult(data);
    saveHistory(data);
    
  } catch(e) {
    result.innerHTML = generateManualForm(query);
  }
}

async function fetchFromEGRUL(inn) {
  try {
    const r = await fetch(`/api/lookup?provider=egrul&inn=${inn}`);
    if (r.ok) {
      const d = await r.json();
      if (d.data) return parseEGRUL(d.data, inn);
    }
  } catch(e) {}
  
  // Fallback — пробуем через dadata с другим токеном
  try {
    const r = await fetch(`https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Token 0b6902c1f7dc64b87fa25698a3c5a97c1cfb437e'
      },
      body: JSON.stringify({query: inn, count: 1})
    });
    const d = await r.json();
    if (d.suggestions && d.suggestions.length > 0) {
      return parseDadata(d.suggestions[0]);
    }
  } catch(e) {}
  return null;
}

function parseEGRUL(raw, inn) {
  const d = raw.СвЮЛ || raw;
  const attr = d['@attributes'] || {};
  
  // Название
  const svNaim = d.СвНаимЮЛ || {};
  const naimAttr = svNaim['@attributes'] || {};
  const nameShort = svNaim.СвНаимЮЛСокр?.['@attributes']?.НаимСокр || '';
  const name = nameShort || naimAttr.НаимЮЛПолн || attr.ОГРН || inn;
  const fullName = naimAttr.НаимЮЛПолн || name;
  
  // Статус
  const isActive = !d.СвПрекрЮЛ;
  
  // Регистрация
  const svReg = d.СвОбрЮЛ?.['@attributes'] || {};
  const regDateRaw = svReg.ДатаРег || attr.ДатаОГРН;
  const regDate = regDateRaw ? new Date(regDateRaw).toLocaleDateString('ru-RU') : '—';
  const ageYears = regDateRaw ? Math.floor((Date.now() - new Date(regDateRaw)) / (365.25*24*60*60*1000)) : 0;
  
  // Адрес
  const svAdr = d.СвАдресЮЛ?.АдресРФ?.['@attributes'] || {};
  const region = d.СвАдресЮЛ?.АдресРФ?.Регион?.['@attributes']?.НаимРегион || '';
  const street = d.СвАдресЮЛ?.АдресРФ?.Улица?.['@attributes'];
  const streetStr = street ? `${street.ТипУлица} ${street.НаимУлица}` : '';
  const dom = svAdr.Дом || '';
  const index = svAdr.Индекс || '';
  const address = [index, region, streetStr, dom].filter(Boolean).join(', ') || '—';
  
  // Руководитель
  const svFl = d.СведДолжнФЛ?.СвФЛ?.['@attributes'] || {};
  const svDolj = d.СведДолжнФЛ?.СвДолжн?.['@attributes'] || {};
  const director = [svFl.Фамилия, svFl.Имя, svFl.Отчество].filter(Boolean).join(' ') || '—';
  const directorPost = svDolj.НаимДолжн || 'Генеральный директор';
  
  // Реквизиты
  const ogrn = attr.ОГРН || '—';
  const kpp = attr.КПП || '—';
  const opf = attr.ПолнНаимОПФ || '—';
  
  // ОКВЭД
  const okvedData = d.СвОКВЭДОтч?.СвОКВЭДОтчОсн?.['@attributes'] || {};
  const okved = okvedData.КодОКВЭД || '—';
  const okvedName = okvedData.НаимОКВЭД || '—';
  
  // Уставный капитал
  const capitalRaw = d.СвУстКап?.['@attributes']?.СумКап || 0;
  const capital = parseFloat(capitalRaw) || 0;
  
  // Налоговый орган
  const nalog = d.СвРегОрг?.['@attributes']?.НаимНО || '—';
  
  // СФР
  const sfr = d.СвРегСФР?.['@attributes']?.НаимСФР || '—';
  const sfrNum = d.СвРегСФР?.['@attributes']?.РегНомСФР || '—';
  
  // Риск-скор
  let riskScore = 100;
  let risks = [], positives = [];
  
  if (!isActive) { riskScore -= 60; risks.push('Компания ликвидирована'); }
  if (ageYears < 1) { riskScore -= 25; risks.push('Зарегистрирована менее года назад'); }
  else if (ageYears < 3) { riskScore -= 10; risks.push('Молодая компания (менее 3 лет)'); }
  if (capital > 0 && capital <= 10000) { riskScore -= 15; risks.push('Минимальный уставный капитал (10 000 ₽)'); }
  
  if (isActive) positives.push('Компания действующая');
  if (ageYears >= 5) positives.push(`Работает ${ageYears} лет (с ${regDate.split('.')[2]} года)`);
  if (capital > 1000000) positives.push(`Крупный уставный капитал: ${(capital/1000000).toFixed(0)} млн ₽`);
  else if (capital > 100000) positives.push(`Уставный капитал ${(capital/1000).toFixed(0)} тыс. ₽`);
  if (ogrn !== '—') positives.push('Данные подтверждены ЕГРЮЛ ФНС');
  if (director !== '—') positives.push(`Руководитель установлен`);
  
  riskScore = Math.max(0, Math.min(100, riskScore));
  
  return {
    name, fullName, inn: attr.ИНН || inn, kpp, ogrn, type: 'ЮЛ', opf,
    status: isActive ? 'ACTIVE' : 'LIQUIDATED',
    statusText: isActive ? 'Действующая' : 'Ликвидирована',
    isActive, regDate, ageYears, address,
    director, directorPost, capital,
    okved, okvedName, nalog, sfr, sfrNum,
    riskScore, risks, positives
  };
}

async function searchByName(name) {
  try {
    const r = await fetch(`https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/party`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Token d1c0b01cf36b05abf50a6bf77e97df50fede4c88'
      },
      body: JSON.stringify({query: name, count: 5})
    });
    const d = await r.json();
    if (d.suggestions && d.suggestions.length > 0) {
      return d.suggestions.map(s => parseDadata(s));
    }
  } catch(e) {}
  return null;
}

function parseDadata(s) {
  const d = s.data;
  const isActive = d.state?.status === 'ACTIVE';
  const isIP = d.type === 'INDIVIDUAL';
  
  const regDate = d.state?.registration_date ? 
    new Date(d.state.registration_date).toLocaleDateString('ru-RU') : '—';
  const liquidDate = d.state?.liquidation_date ?
    new Date(d.state.liquidation_date).toLocaleDateString('ru-RU') : null;
  
  // Считаем возраст компании
  const ageYears = d.state?.registration_date ? 
    Math.floor((Date.now() - d.state.registration_date) / (365.25*24*60*60*1000)) : 0;
  
  // Риск-скор
  let riskScore = 100;
  let risks = [];
  let positives = [];
  
  if (!isActive) { riskScore -= 60; risks.push('Компания не действует'); }
  if (ageYears < 1) { riskScore -= 20; risks.push('Компания зарегистрирована менее года назад'); }
  if (ageYears >= 1 && ageYears < 3) { riskScore -= 10; risks.push('Компания молодая (1-3 года)'); }
  if (d.capital?.value && d.capital.value <= 10000) { riskScore -= 10; risks.push('Минимальный уставный капитал (10 000 ₽)'); }
  
  if (isActive) positives.push('Компания действует');
  if (ageYears >= 5) positives.push(`Работает более ${ageYears} лет`);
  if (d.capital?.value && d.capital.value > 100000) positives.push(`Уставный капитал ${(d.capital.value/1000).toFixed(0)} тыс. ₽`);
  
  riskScore = Math.max(0, Math.min(100, riskScore));
  
  return {
    name: s.value,
    inn: d.inn,
    kpp: d.kpp || '—',
    ogrn: d.ogrn || '—',
    type: isIP ? 'ИП' : 'ЮЛ',
    status: d.state?.status || 'UNKNOWN',
    statusText: isActive ? 'Действующая' : (d.state?.status === 'LIQUIDATING' ? 'В процессе ликвидации' : 'Ликвидирована'),
    isActive,
    regDate,
    liquidDate,
    ageYears,
    address: d.address?.unrestricted_value || '—',
    director: d.management?.name || (isIP ? s.value : '—'),
    directorPost: d.management?.post || (isIP ? 'Индивидуальный предприниматель' : '—'),
    capital: d.capital?.value || 0,
    okved: d.okved || '—',
    okvedName: d.okved_type || '—',
    employeeCount: d.employee_count || null,
    riskScore,
    risks,
    positives,
  };
}

function generateManualForm(query) {
  return `
    <div class="card">
      <div style="font-size:28px;margin-bottom:12px">🔍</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">Компания не найдена автоматически</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">
        Проверь компанию вручную через официальные источники:
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a href="https://egrul.nalog.ru/index.html" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border-radius:10px;text-decoration:none;color:var(--text);transition:all 0.2s" onmouseover="this.style.borderColor='rgba(255,107,0,0.3)'" >
          <span style="font-size:20px">🏛️</span>
          <div><div style="font-size:13px;font-weight:500">ЕГРЮЛ — ФНС России</div><div style="font-size:11px;color:var(--muted)">egrul.nalog.ru — официальный реестр</div></div>
          <span style="margin-left:auto;color:var(--accent)">→</span>
        </a>
        <a href="https://zachestnyibiznes.ru/company/ul/${query}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border-radius:10px;text-decoration:none;color:var(--text)">
          <span style="font-size:20px">✅</span>
          <div><div style="font-size:13px;font-weight:500">Честный бизнес</div><div style="font-size:11px;color:var(--muted)">zachestnyibiznes.ru</div></div>
          <span style="margin-left:auto;color:var(--accent)">→</span>
        </a>
        <a href="https://www.rusprofile.ru/search?query=${encodeURIComponent(query)}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border-radius:10px;text-decoration:none;color:var(--text)">
          <span style="font-size:20px">📊</span>
          <div><div style="font-size:13px;font-weight:500">Rusprofile</div><div style="font-size:11px;color:var(--muted)">Финансовая отчётность компании</div></div>
          <span style="margin-left:auto;color:var(--accent)">→</span>
        </a>
        <a href="https://kad.arbitr.ru/?_=1&nc=1&nameof=${encodeURIComponent(query)}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border-radius:10px;text-decoration:none;color:var(--text)">
          <span style="font-size:20px">⚖️</span>
          <div><div style="font-size:13px;font-weight:500">Картотека арбитражных дел</div><div style="font-size:11px;color:var(--muted)">Суды и банкротства</div></div>
          <span style="margin-left:auto;color:var(--accent)">→</span>
        </a>
      </div>

function getTxHistoryForCounterparty(name, inn) {
  // Пробуем взять из localStorage (данные синхронизированные с главной)
  const cached = localStorage.getItem('omsfin_tx_cache');
  let txs = [];
  try { txs = JSON.parse(cached || '[]'); } catch(e) {}

  if (!txs.length) return null;

  // Ищем по имени или ИНН
  const matches = txs.filter(t => {
    if (inn && t.inn && t.inn === inn) return true;
    if (name && t.name && t.name.toLowerCase().includes(name.toLowerCase().substring(0,10))) return true;
    return false;
  });

  if (!matches.length) return null;

  const income = matches.filter(t=>t.amount>0).reduce((s,t)=>s+Number(t.amount),0);
  const expense = matches.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(Number(t.amount)),0);
  const last5 = [...matches].sort((a,b)=>{
    const da = a.date ? parseDMY(a.date) : 0;
    const db = b.date ? parseDMY(b.date) : 0;
    return db - da;
  }).slice(0,5);

  return {income, expense, count: matches.length, last5};
}

function renderTxHistory(name, inn) {
  const data = getTxHistoryForCounterparty(name, inn);

  return `
    <div class="card" style="margin-top:0">

          <div style="font-size:14px;font-weight:700;color:var(--green)">${data.income ? '+'+fmtR(data.income) : '—'}</div>
        </div>
        <div style="background:rgba(239,68,68,0.07);border-radius:10px;padding:10px 12px">

      ${data.last5.map(t => `

      </div>
    </div>`;
}

function saveHistory(d) {
  checkHistory = checkHistory.filter(h => h.inn !== d.inn);
  checkHistory.unshift({...d, checkedAt: new Date().toISOString()});
  checkHistory = checkHistory.slice(0, 50);
  localStorage.setItem('omsfin_cp_history', JSON.stringify(checkHistory));
  renderHistory();
}

// Загружаем контрагентов из выписки
async function loadFromTx() {
  const token = localStorage.getItem('omschicken_token') || '';
  try {
    const r = await fetch('/api/transactions', {headers:{'Authorization':'Bearer '+token}});
    const txs = await r.json();
    
    // Собираем уникальные компании
    const companies = {};
    txs.forEach(t => {
      const name = t.name || '';
      // Фильтруем только юрлиц и ИП
      if (name.includes('ООО') || name.includes('ИП') || name.includes('АО') || name.includes('ПАО') || name.includes('ЗАО') || name.includes('ОБЩЕСТВО') || name.includes('ИНДИВИДУАЛЬНЫЙ')) {
        if (!companies[name]) {
          companies[name] = {name, count:0, total:0, lastDate:t.date};
        }
        companies[name].count++;
        companies[name].total += Math.abs(Number(t.amount));
        // Сравниваем даты хронологически, а не как текст (формат DD.MM.YYYY некорректно
        // сравнивается строками при пересечении границы месяца/года).
        if (parseDMY(t.date) > parseDMY(companies[name].lastDate)) companies[name].lastDate = t.date;
      }
    });
    
    const sorted = Object.values(companies).sort((a,b)=>b.total-a.total);
    
    if (!sorted.length) {
      document.getElementById('fromTxList').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Юридические лица в выписке не найдены</div>';
      return;
    }
    
    document.getElementById('fromTxList').innerHTML = `
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Найдено ${sorted.length} контрагентов. Нажми для проверки.</div>
      <div class="from-tx-list">
        ${sorted.map(c=>`
          <div class="from-tx-item" onclick="document.getElementById('searchInput').value='${c.name.replace(/'/g,"\\'")}';showPage('search',document.querySelectorAll('.tab')[0]);checkCompany()">
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name}</div>
              <div style="font-size:10px;color:var(--muted)">${c.count} операций · последняя ${c.lastDate||'—'}</div>
            </div>
            <div style="font-family:Unbounded,sans-serif;font-size:11px;color:var(--accent);flex-shrink:0">${Math.abs(c.total).toLocaleString('ru-RU',{maximumFractionDigits:0})} ₽</div>
            <div style="color:var(--muted);font-size:12px;margin-left:8px">→</div>
          </div>`).join('')}
      </div>`;
  } catch(e) {
    document.getElementById('fromTxList').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Ошибка загрузки</div>';
  }
}

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='history') renderHistory();
  if(name==='fromtx') loadFromTx();
}
