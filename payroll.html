<style>
  /* Плавный переход между темами */
  /* ── Светлая тема: фикс хардкоженных rgba(255,255,255,...) ── */
  body.light .stat-label{color:rgba(0,0,0,0.45)!important;}
  body.light .tx-date,body.light .tx-desc{color:rgba(0,0,0,0.45)!important;}
  body.light .hero-stat-sub{color:rgba(0,0,0,0.45)!important;}
  body.light .stat-card{box-shadow:0 1px 4px rgba(0,0,0,0.07),0 2px 10px rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.06);}
  body.light .stat-card:hover{box-shadow:0 4px 16px rgba(229,80,0,0.12)!important;}
  body.light header{box-shadow:0 1px 8px rgba(0,0,0,0.08);}
  body.light .hero-stat{background:linear-gradient(135deg,rgba(229,80,0,0.06),rgba(229,80,0,0.02))!important;border:1px solid rgba(229,80,0,0.12);}
  body.light .hero-stat::before{background:radial-gradient(circle at 0% 50%,rgba(229,80,0,0.08),transparent 60%)!important;}
  body.light .pill{color:rgba(0,0,0,0.55)!important;background:rgba(0,0,0,0.04)!important;}
  body.light .pill.active,.body.light .pill:hover{color:var(--accent)!important;background:rgba(229,80,0,0.08)!important;}
  body.light .progress-track,.body.light .chart-bar-wrap,.body.light .progress-wrap{background:rgba(0,0,0,0.07)!important;}
  body.light .section-title{color:var(--accent);}
  body.light .empty,.body.light .empty-state{color:rgba(0,0,0,0.35);}
  body.light .chart-card,.body.light .usn-calc-card,.body.light .forecast-card{box-shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);}
  body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);}
  body.light .ai-fab{box-shadow:0 4px 20px rgba(229,80,0,0.35);}
  body.light .bottom-nav{box-shadow:0 -1px 8px rgba(0,0,0,0.08);}
  body.light .tx-row:hover{background:rgba(0,0,0,0.02)!important;}
  body.light .modal,.body.light .ai-modal{box-shadow:0 20px 60px rgba(0,0,0,0.15)!important;}
  body.light input,body.light select,body.light textarea{background:#fff!important;border-color:rgba(0,0,0,0.14)!important;color:#1a1a1a!important;}
  body.light input::placeholder,body.light textarea::placeholder{color:rgba(0,0,0,0.35)!important;}
  body.light .btn-outline{background:#fff!important;border-color:rgba(0,0,0,0.14)!important;color:#1a1a1a!important;}
  body.light .btn-outline:hover{background:rgba(229,80,0,0.06)!important;border-color:var(--accent)!important;color:var(--accent)!important;}
  body.light .bottom-nav{background:rgba(255,255,255,0.95)!important;border-top:1px solid rgba(0,0,0,0.08)!important;}
  body.light .bottom-nav a{color:rgba(0,0,0,0.45)!important;}
  body.light .bottom-nav a.active{color:var(--accent)!important;}
  /* ── Аврора: градиентные акценты ── */
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:40px;}
  .logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:16px;}
  .logo span{color:var(--accent);}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}
  main{max-width:920px;margin:0 auto;padding:24px 16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;}
  .section-title{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;margin-bottom:16px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .input-group{margin-bottom:10px}
  .input-group label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}
  .input-group input,.input-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none}
  .input-row{display:grid;grid-template-columns:2fr 1.2fr 1fr;gap:10px}
  .btn{background:linear-gradient(135deg,var(--accent),#e55a00);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(255,107,0,0.25)}
  .btn-sm{font-size:10px;padding:7px 14px}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 16px;font-family:'Unbounded',sans-serif;font-size:10px;font-weight:700;cursor:pointer}
  .emp-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
  .emp-row:last-child{border-bottom:none}
  .emp-name{font-weight:500}
  .emp-pos{font-size:11px;color:var(--muted)}
  .emp-salary{font-family:'Unbounded',sans-serif;font-weight:700;color:var(--accent)}
  .empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
  .period-picker{display:flex;gap:8px;align-items:center;margin-bottom:16px}
  .period-picker input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px}
  .run-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--surface2);border-radius:10px;margin-bottom:8px;font-size:13px}
  .run-status{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600}
  .run-status.planned{background:rgba(255,107,0,0.15);color:var(--accent)}
  .run-status.paid{background:rgba(34,197,94,0.15);color:var(--green)}
  .summary-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
  .summary-card{background:var(--surface2);border-radius:10px;padding:14px;text-align:center}
  .summary-label{font-size:10px;color:var(--muted);margin-bottom:6px}
  .summary-value{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;z-index:100;display:none}
  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:200;padding:6px 0 env(safe-area-inset-bottom,6px);}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:9px;padding:4px 0;transition:color 0.15s;}
  .bottom-nav a.active,.bottom-nav a:hover{color:var(--accent);}
  .bottom-nav .bn-icon{font-size:20px;line-height:1;}
  @media(max-width:700px){.bottom-nav{display:flex;} body{padding-bottom:60px;}}
  @media(max-width:600px){
    header{padding:12px 14px;}
    main{padding:12px 14px;}
    .summary-grid{grid-template-columns:1fr 1fr!important;}
    .summary-value{font-size:13px;}
    input,select,textarea{font-size:16px!important;}
    .btn{width:100%;margin-bottom:6px;}
    table{font-size:11px;}
    th,td{padding:6px 8px!important;}
  }
</style>

<main>
  <!-- Герой: ФОТ последнего начисленного месяца -->
  <div id="payrollHero" style="display:none;background:linear-gradient(135deg,rgba(255,107,0,0.08),rgba(255,107,0,0.02));border:1px solid rgba(255,107,0,0.2);border-radius:16px;padding:22px 24px;margin-bottom:20px">
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px" id="payrollHeroLabel">ФОТ за месяц</div>
    <div style="font-family:'Unbounded',sans-serif;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1" id="payrollHeroTotal">—</div>
    <div style="font-size:13px;color:var(--text-2,#a3a3a3);margin-top:8px" id="payrollHeroSub"></div>
  </div>

  <!-- Сотрудники -->
  <div class="card">

<div class="toast" id="toast"></div>

<script>
function getCompanyId() { return localStorage.getItem('omsfin_company') || ''; }

function fmt(n) { return Math.round(Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }

function showToast(msg, dur=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.style.display = 'none', dur);
}
window.onerror=function(m){if(/Script error|ResizeObserver/.test(m))return false;showToast('⚠️ '+String(m).substring(0,70));return false;};
window.addEventListener('unhandledrejection',e=>{const m=e.reason?.message||String(e.reason);if(/Failed to fetch|NetworkError|AbortError/.test(m))showToast('📡 Нет сети — проверьте соединение');else if(m&&m.length<80)showToast('⚠️ '+m);});

let employees = [];

async function loadEmployees() {
  const companyId = getCompanyId();
  if (!companyId) {
    document.getElementById('empList').innerHTML = '<div class="empty">Сначала выбери компанию на главной странице</div>';
    return;
  }
  try {
    const r = await fetch(`/api/employees?resource=employees&company_id=${companyId}`, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    const data = await r.json();
    if (data.error) { document.getElementById('empList').innerHTML = `<div class="empty">❌ ${escapeHtml(data.error)}</div>`; return; }

    employees = (data || []).filter(e => e.is_active !== false);
    document.getElementById('empCount').textContent = employees.length + ' чел.';

    if (!employees.length) {
      document.getElementById('empList').innerHTML = '<div class="empty">Пока нет сотрудников — добавь первого ниже</div>';
      return;
    }

    document.getElementById('empList').innerHTML = employees.map(e => `
      <div class="emp-row">
        <div>
          <div class="emp-name">${escapeHtml(e.full_name)}</div>
          <div class="emp-pos">${e.position || 'Без должности'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="emp-salary">${fmt(e.salary)}</div>
          <button onclick="removeEmployee('${e.id}')" style="background:none;border:none;color:var(--red);font-size:13px;cursor:pointer">✕</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('empList').innerHTML = '<div class="empty">❌ Ошибка загрузки</div>';
  }
}

let _empBusy = false;
async function addEmployee() {
  if (_empBusy) return;
  const companyId = getCompanyId();
  if (!companyId) { showToast('Сначала выбери компанию'); return; }

  const full_name = document.getElementById('newEmpName').value.trim();
  const position = document.getElementById('newEmpPos').value.trim();
  const salary = parseFloat(document.getElementById('newEmpSalary').value);

  if (!full_name) { showToast('Введи ФИО сотрудника'); return; }
  if (!salary || salary <= 0 || isNaN(salary)) { showToast('Введи корректный оклад'); return; }

  _empBusy = true;
  const _btn = event?.target; if (_btn) { _btn.disabled = true; _btn.style.opacity = '0.5'; }
  try {
    const r = await fetch('/api/employees?resource=employees', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_id: companyId, full_name, position, salary })
    });
    const data = await r.json();
    if (data.error) { showToast('❌ ' + data.error); return; }

    document.getElementById('newEmpName').value = '';
    document.getElementById('newEmpPos').value = '';
    document.getElementById('newEmpSalary').value = '';
    showToast('✅ Сотрудник добавлен');
    loadEmployees();
  } catch (e) {
    console.error(e);
    showToast('❌ Ошибка добавления');
  } finally {
    _empBusy = false;
    if (_btn) { _btn.disabled = false; _btn.style.opacity = ''; }
  }
}

function removeEmployee(id) {
  showConfirm('Уволить сотрудника? История его начислений сохранится.', async () => {
    const companyId = getCompanyId();
    try {
      const r = await fetch('/api/employees?resource=employees', {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ company_id: companyId, id })
      });
      const data = await r.json();
      if (data.error) { showToast('❌ ' + data.error); return; }
      showToast('✅ Сотрудник удалён из активных');
      loadEmployees();
    } catch (e) {
      showToast('❌ Ошибка удаления');
    }
  }, 'Уволить', true);
}

let _calcBusy = false;
async function calculatePayroll() {
  if (_calcBusy) return;
  const companyId = getCompanyId();
  if (!companyId) { showToast('Сначала выбери компанию'); return; }

  const monthInput = document.getElementById('payrollPeriod').value; // формат YYYY-MM
  if (!monthInput) { showToast('Выбери месяц'); return; }
  const [yyyy, mm] = monthInput.split('-');
  const period = `${mm}.${yyyy}`;

  _calcBusy = true;
  const _btn = event?.target; if (_btn) { _btn.disabled = true; _btn.textContent = '⏳ Начисляем...'; }
  try {
    const r = await fetch('/api/employees?resource=payroll', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_id: companyId, action: 'calculate', period })
    });
    const data = await r.json();
    if (data.error) { showToast('❌ ' + data.error); return; }

    const runs = data.runs || [];
    const totalGross = runs.reduce((s, r) => s + Number(r.salary_gross), 0);
    const totalNdfl = runs.reduce((s, r) => s + Number(r.ndfl), 0);
    const totalContrib = runs.reduce((s, r) => s + Number(r.contributions), 0);

    document.getElementById('calcResult').innerHTML = `
      <div class="summary-row">
        <div class="summary-card"><div class="summary-label">Начислено (gross)</div><div class="summary-value">${fmt(totalGross)}</div></div>
        <div class="summary-card"><div class="summary-label">НДФЛ к перечислению</div><div class="summary-value" style="color:var(--accent)">${fmt(totalNdfl)}</div></div>
        <div class="summary-card"><div class="summary-label">Страховые взносы</div><div class="summary-value" style="color:var(--red)">${fmt(totalContrib)}</div></div>
      </div>
      <div style="font-size:12px;color:var(--muted);text-align:center">Начислено за ${period} для ${runs.length} сотрудников. Подробности — в истории ниже.</div>
    `;

    showToast(`✅ Начислено за ${period}`);
    loadHistory();
  } catch (e) {
    console.error(e);
    showToast('❌ Ошибка начисления');
  } finally {
    _calcBusy = false;
    if (_btn) { _btn.disabled = false; _btn.textContent = 'Начислить за этот месяц'; }
  }
}

async function markPaid(id) {
  try {
    const r = await fetch('/api/employees?resource=payroll', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_id: getCompanyId(), action: 'mark_paid', id })
    });
    const data = await r.json();
    if (data.error) { showToast('❌ ' + data.error); return; }
    showToast('✅ Отмечено как выплачено');
    loadHistory();
  } catch (e) {
    showToast('❌ Ошибка');
  }
}

async function loadHistory() {
  const companyId = getCompanyId();
  if (!companyId) return;

  try {
    // Загружаем всех сотрудников (включая уволенных) для корректного отображения имён
    let allEmps = employees;
    if (!allEmps.length) {
      const er = await fetch(`/api/employees?resource=employees&company_id=${companyId}`, {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      const ed = await er.json();
      if (Array.isArray(ed)) allEmps = ed;
    }

    const r = await fetch(`/api/employees?resource=payroll&company_id=${companyId}`, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    const data = await r.json();
    if (data.error) { document.getElementById('historyList').innerHTML = `<div class="empty">❌ ${escapeHtml(data.error)}</div>`; return; }

    if (!data.length) {
      document.getElementById('historyList').innerHTML = '<div class="empty">Начислите зарплату за месяц — итоги появятся здесь</div>';
      return;
    }

    const empById = {};
    allEmps.forEach(e => empById[e.id] = e.full_name);

    // Герой: итоги последнего начисленного периода
    try {
      const periods = [...new Set(data.map(r => r.period).filter(Boolean))].sort((a,b)=>parsePeriod(a)-parsePeriod(b));
      const lastP = periods[periods.length - 1];
      if (lastP) {
        const runs = data.filter(r => r.period === lastP);
        const g = runs.reduce((s,r)=>s+Number(r.salary_gross||0),0);
        const n = runs.reduce((s,r)=>s+Number(r.ndfl||0),0);
        const c = runs.reduce((s,r)=>s+Number(r.contributions||0),0);
        document.getElementById('payrollHeroLabel').textContent = 'ФОТ за ' + lastP;
        if (window.OMSFX) OMSFX.animateNumber(document.getElementById('payrollHeroTotal'), g); else document.getElementById('payrollHeroTotal').textContent = fmt(g);
        document.getElementById('payrollHeroSub').textContent = 'НДФЛ ' + fmt(n) + ' · Взносы ' + fmt(c) + ' · ' + runs.length + ' сотр.';
        document.getElementById('payrollHero').style.display = 'block';
      }
    } catch(e) { console.error(e); }

    document.getElementById('historyList').innerHTML = data.map(run => `
      <div class="run-row">
        <div>
          <div style="font-weight:500">${escapeHtml(empById[run.employee_id] || 'Сотрудник')} · ${run.period}</div>
          <div style="font-size:11px;color:var(--muted)">Начислено ${fmt(run.salary_gross)} · НДФЛ ${fmt(run.ndfl)} · К выплате ${fmt(run.salary_net)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="run-status ${run.status}">${run.status === 'paid' ? 'Выплачено' : 'Запланировано'}</span>
          ${run.status !== 'paid' ? `<button class="btn-outline" onclick="markPaid('${run.id}')">Отметить выплату</button>` : ''}
          <button class="btn-outline" onclick='printPayslip(${JSON.stringify(run)}, ${JSON.stringify(empById[run.employee_id] || 'Сотрудник')})'>Листок</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('historyList').innerHTML = '<div class="empty">❌ Ошибка загрузки</div>';
  }
}

function printPayslip(run, empName) {
  const companyName = localStorage.getItem('omsfin_company_name') || 'Компания';
  const gross = Math.round(Number(run.salary_gross));
  const ndfl = Math.round(Number(run.ndfl));
  const contrib = Math.round(Number(run.contributions));
  const net = Math.round(Number(run.salary_net));

  const fmtR = n => n.toLocaleString('ru-RU') + ' ₽';

  const html = `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<title>Расчётный листок · ${empName} · ${run.period}</title>
<style>
  body{font-family:'Times New Roman',serif;font-size:11pt;color:#000;background:#fff;margin:0;padding:20mm}
  h2{text-align:center;font-size:13pt;margin-bottom:4px}
  .sub{text-align:center;font-size:10pt;color:#444;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;margin-bottom:12px}
  td,th{border:1px solid #000;padding:4px 7px;font-size:10pt}
  th{background:#f5f5f5;font-weight:bold;text-align:left}
  .right{text-align:right}
  .total td{font-weight:bold;font-size:11pt}
  .footer{font-size:9pt;color:#555;margin-top:16px}
  .sign-row{display:flex;justify-content:space-between;margin-top:40px;font-size:10pt}
  @media print{body{padding:10mm}}
</style>
</head><body onload="window.print()">
<h2>РАСЧЁТНЫЙ ЛИСТОК</h2>
<div class="sub">${companyName} · За период: <b>${run.period}</b></div>

<table>
  <tr><th colspan="2">Сотрудник</th></tr>
  <tr><td>ФИО</td><td>${empName}</td></tr>
  <tr><td>Период</td><td>${run.period}</td></tr>
  <tr><td>Статус выплаты</td><td>${run.status === 'paid' ? 'Выплачено' : 'Запланировано'}</td></tr>
</table>

<table>
  <tr><th>Начисления</th><th class="right">Сумма</th></tr>
  <tr><td>Оклад (gross)</td><td class="right">${fmtR(gross)}</td></tr>
</table>

<table>
  <tr><th>Удержания</th><th class="right">Сумма</th></tr>
  <tr><td>НДФЛ (удержан работодателем)</td><td class="right">${fmtR(ndfl)}</td></tr>
</table>

<table>
  <tr><th>Начисления работодателя</th><th class="right">Сумма</th></tr>
  <tr><td>Страховые взносы (не удерживаются из зарплаты)</td><td class="right">${fmtR(contrib)}</td></tr>
</table>

<table>
  <tr class="total"><td>К выплате на руки</td><td class="right">${fmtR(net)}</td></tr>
</table>

<div class="sign-row">
  <div>Подпись работодателя: ________________________</div>
  <div>Дата выдачи: ___.____.${new Date().getFullYear()}</div>
</div>
<div class="footer">
  НДФЛ рассчитан по прогрессивной шкале 2026 нарастающим итогом с начала года.<br>
  Страховые взносы уплачиваются работодателем в бюджет ПФР/ФСС и не удерживаются из зарплаты.
</div>
<nav class="bottom-nav">
  <a href="/" class="active"><span class="bn-icon"><i data-lucide="home" style="width:20px;height:20px"></i></span>Главная</a>
  <a href="/analytics.html"><span class="bn-icon"><i data-lucide="bar-chart-3" style="width:20px;height:20px"></i></span>Аналитика</a>
  <a href="/docs.html"><span class="bn-icon"><i data-lucide="file-text" style="width:20px;height:20px"></i></span>Документы</a>
  <a href="/declarations.html"><span class="bn-icon"><i data-lucide="clipboard-list" style="width:20px;height:20px"></i></span>Декларации</a>
  <a href="/settings.html"><span class="bn-icon"><i data-lucide="settings" style="width:20px;height:20px"></i></span>Настройки</a>
</nav>
</body></html>`;

  const win = window.open('', '_blank', 'width=800,height=600');
  win.document.write(html);
  win.document.close();
}

// Дефолтный период — текущий месяц
const now = new Date();
document.getElementById('payrollPeriod').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

</script>
</body>
